name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: input
    id: odoo
    attributes:
      label: Odoo version and how you run it
      placeholder: "18.0, self-hosted with docker / Odoo.sh"
    validations: {required: true}
  - type: dropdown
    id: mode
    attributes:
      label: Operation mode
      options: ["Offline: Export RFP", "Offline: Import Generated App", "Online API"]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: {required: true}
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "Please remove anything private: customer names, keys, tokens."
      render: shell
